name: CI

on:
  push:
    branches: ["main", "master", "codex/**", "feat/**", "fix/**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore AiJobSearchAgent.slnx

      - name: Build
        run: dotnet build AiJobSearchAgent.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet run --project tests/AiJobSearchAgent.Tests/AiJobSearchAgent.Tests.csproj --configuration Release --no-build
