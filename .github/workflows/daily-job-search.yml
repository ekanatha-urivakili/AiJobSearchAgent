name: Daily Job Search

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run agent
        run: dotnet run --project src/AiJobSearchAgent.Worker/AiJobSearchAgent.Worker.csproj --configuration Release

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: daily-job-reports
          path: src/AiJobSearchAgent.Worker/bin/Release/net10.0/reports/*.md
